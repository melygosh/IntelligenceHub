# Production web server for the SPA. Serves the Vite-built static bundle and
# proxies the API + Bull Board to the `api` service (same origin, so no CORS
# preflight and the auth cookie flows through). Replaces Vite's dev proxy.
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # gzip text assets (cheap win for the JS/CSS bundle).
  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;

  # API — the app calls relative /api/*; the NestJS global prefix is also /api,
  # so the full path is preserved (no rewrite). proxy_pass without a URI keeps
  # the original request path.
  location /api/ {
    proxy_pass http://api:3011;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # SSE (the events channel) needs buffering off + a long read timeout.
    proxy_buffering off;
    proxy_read_timeout 1h;
  }

  # Bull Board (basic-auth enforced by the api). The Authorization header is
  # forwarded by default.
  location /admin/queues {
    proxy_pass http://api:3011;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # SPA fallback: client-side routes (/articles, /graph, …) resolve to index.html.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
