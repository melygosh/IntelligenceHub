services:
  postgres:
    image: postgres:16-alpine
    container_name: ih-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      # Host port 5433 to avoid clashing with a local Postgres on 5432.
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: ih-redis
    ports:
      # Host port 6380 to avoid clashing with a local Redis on 6379.
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: ih-api
    environment:
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN}
      BULL_BOARD_USER: ${BULL_BOARD_USER}
      BULL_BOARD_PASS: ${BULL_BOARD_PASS}
      APP_DEV_MODE: ${APP_DEV_MODE}
      APP_BASE_URL: ${APP_BASE_URL}
      WEB_BASE_URL: ${WEB_BASE_URL}
      API_PORT: ${API_PORT}
      LLM_PROVIDER: ${LLM_PROVIDER}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      LLM_MODEL_OPENAI: ${LLM_MODEL_OPENAI}
      LLM_MODEL_ANTHROPIC: ${LLM_MODEL_ANTHROPIC}
      LLM_CONCURRENCY: ${LLM_CONCURRENCY}
      LLM_TOKEN_LIMIT_PER_ARTICLE: ${LLM_TOKEN_LIMIT_PER_ARTICLE}
      FEED_PULL_INTERVAL_SECONDS: ${FEED_PULL_INTERVAL_SECONDS}
    ports:
      # Host port 3010 -> container port 3011. Both 3000 and 3005 are taken on the
      # dev host, so the container listens on 3011 for defense in depth.
      - "3010:3011"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: ih-web
    environment:
      # Vite proxy target inside the docker network — must use the api service hostname,
      # not localhost (localhost inside the web container = the web container itself).
      VITE_API_BASE_URL: http://api:3011
    ports:
      # Host port 5174 to avoid clashing with any local Vite dev server on 5173.
      - "5174:5173"
    depends_on:
      - api

volumes:
  postgres_data:
