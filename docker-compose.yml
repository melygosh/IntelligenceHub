# Shared backend env, reused by both the `api` (HTTP) and `worker` (BullMQ
# consumers) services — they run the same image with a different APP_ROLE.
x-api-env: &api-env
  DATABASE_URL: ${DATABASE_URL:-}
  REDIS_URL: ${REDIS_URL:-}
  JWT_SECRET: ${JWT_SECRET:-}
  JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-}
  BULL_BOARD_USER: ${BULL_BOARD_USER:-}
  BULL_BOARD_PASS: ${BULL_BOARD_PASS:-}
  APP_DEV_MODE: ${APP_DEV_MODE:-}
  APP_BASE_URL: ${APP_BASE_URL:-}
  WEB_BASE_URL: ${WEB_BASE_URL:-}
  API_PORT: ${API_PORT:-}
  LLM_PROVIDER: ${LLM_PROVIDER:-}
  LLM_PROVIDER_MODEL: ${LLM_PROVIDER_MODEL:-}
  LLM_PROVIDER_API_KEY: ${LLM_PROVIDER_API_KEY:-}
  LLM_FALLBACK_PROVIDER: ${LLM_FALLBACK_PROVIDER:-}
  LLM_FALLBACK_PROVIDER_MODEL: ${LLM_FALLBACK_PROVIDER_MODEL:-}
  LLM_FALLBACK_PROVIDER_API_KEY: ${LLM_FALLBACK_PROVIDER_API_KEY:-}
  LLM_CONCURRENCY: ${LLM_CONCURRENCY:-}
  LLM_TOKEN_LIMIT_PER_ARTICLE: ${LLM_TOKEN_LIMIT_PER_ARTICLE:-}
  LLM_TOKEN_LIMIT_PER_DIGEST: ${LLM_TOKEN_LIMIT_PER_DIGEST:-}
  SUMMARY_MAX_CHARS: ${SUMMARY_MAX_CHARS:-}
  DIGEST_MIN_PARAGRAPHS: ${DIGEST_MIN_PARAGRAPHS:-}
  DIGEST_MAX_PARAGRAPHS: ${DIGEST_MAX_PARAGRAPHS:-}
  LLM_TIMEOUT_MS: ${LLM_TIMEOUT_MS:-}
  ANALYZE_MAX_ATTEMPTS: ${ANALYZE_MAX_ATTEMPTS:-}
  ANALYZE_BACKOFF_SECONDS: ${ANALYZE_BACKOFF_SECONDS:-}
  ANALYZE_CONCURRENCY: ${ANALYZE_CONCURRENCY:-}
  FEED_PULL_CRON: ${FEED_PULL_CRON:-}
  FEED_PULL_CONCURRENCY: ${FEED_PULL_CONCURRENCY:-}
  FEED_FETCH_CACHE_TTL_SECONDS: ${FEED_FETCH_CACHE_TTL_SECONDS:-}
  FEED_GIVE_UP_AFTER_FAILURES: ${FEED_GIVE_UP_AFTER_FAILURES:-}
  PREFILTER_MIN_LENGTH: ${PREFILTER_MIN_LENGTH:-}
  PREFILTER_EMPTY_ENABLED: ${PREFILTER_EMPTY_ENABLED:-}
  PREFILTER_MIN_LENGTH_ENABLED: ${PREFILTER_MIN_LENGTH_ENABLED:-}
  PREFILTER_SPAM_TITLE_RATIO_ENABLED: ${PREFILTER_SPAM_TITLE_RATIO_ENABLED:-}
  PREFILTER_SPAM_LINK_DENSITY_ENABLED: ${PREFILTER_SPAM_LINK_DENSITY_ENABLED:-}
  PREFILTER_TITLE_RATIO: ${PREFILTER_TITLE_RATIO:-}
  PREFILTER_LINK_DENSITY_RATIO: ${PREFILTER_LINK_DENSITY_RATIO:-}
  DIGEST_MAX_LLM_ARTICLES: ${DIGEST_MAX_LLM_ARTICLES:-}
  GRAPH_SELECTION_CAP: ${GRAPH_SELECTION_CAP:-}
  GRAPH_SIMILAR_EDGES_PER_NODE: ${GRAPH_SIMILAR_EDGES_PER_NODE:-}
  SEMANTIC_SIMILARITY_ENABLED: ${SEMANTIC_SIMILARITY_ENABLED:-}
  SEMANTIC_SIMILARITY_PROVIDER: ${SEMANTIC_SIMILARITY_PROVIDER:-}
  SEMANTIC_SIMILARITY_MODEL: ${SEMANTIC_SIMILARITY_MODEL:-}
  SEMANTIC_SIMILARITY_API_KEY: ${SEMANTIC_SIMILARITY_API_KEY:-}
  SEMANTIC_SIMILARITY_THRESHOLD: ${SEMANTIC_SIMILARITY_THRESHOLD:-}

services:
  postgres:
    # pgvector/pgvector:pg16 is a drop-in PG16 image bundled with the pgvector
    # extension — required for the semantic similarity feature (ADR-7 / FR-5
    # Could). Data files are PG16-compatible so existing volumes carry over.
    image: pgvector/pgvector:pg16
    container_name: ih-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      # Host port 5433 to avoid clashing with a local Postgres on 5432.
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: ih-redis
    ports:
      # Host port 6380 to avoid clashing with a local Redis on 6379.
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: ih-api
    # role=api: serves HTTP + Bull Board + queue producers; runs NO consumers
    # (the worker service owns those). Runs migrations on boot.
    environment:
      <<: *api-env
      APP_ROLE: api
    ports:
      # Host port 3010 -> the container's API_PORT (default 3011). Both 3000 and
      # 3005 are taken on the dev host, so the container listens on 3011 for
      # defense in depth. The container side follows ${API_PORT} so the publish
      # mapping, the app's bind port, and the healthcheck can never drift.
      - "3010:${API_PORT}"
    # The app binds the port only AFTER migrations finish, so "port open" is a
    # safe readiness signal — the worker waits on it before starting (schema is
    # guaranteed present and the worker skips migrate).
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"require('net').connect(${API_PORT},'127.0.0.1').on('connect',()=>process.exit(0)).on('error',()=>process.exit(1))\"",
        ]
      interval: 5s
      timeout: 5s
      retries: 30
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # Background workers (BullMQ consumers + cron scheduler). Same image as `api`,
  # role=worker: runs the processors, no HTTP. Decouples background load from the
  # API process (Principle 3 / FR-1). Skips migrate (api owns it) and waits for
  # api to be healthy so the schema exists.
  worker:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: ih-worker
    environment:
      <<: *api-env
      APP_ROLE: worker
    command: ["sh", "-c", "node dist/main.js"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      api:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: ih-web
    ports:
      # Host port 5174 -> nginx :80. The SPA calls relative /api, which nginx
      # proxies to the api service (see apps/web/nginx.conf).
      - "5174:80"
    depends_on:
      - api

volumes:
  postgres_data:
